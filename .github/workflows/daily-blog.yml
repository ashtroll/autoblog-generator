name: Daily Blog Generator

on:
  schedule:
    - cron: '30 0 * * *'    # 6:00 AM IST  — Groq
    - cron: '30 13 * * *'   # 7:00 PM IST  — Groq2
  workflow_dispatch:
    inputs:
      provider:
        description: 'LLM provider to use'
        required: false
        default: 'auto'
        type: choice
        options: [auto, groq, groq2]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select LLM provider
        run: |
          INPUT_PROVIDER="${{ github.event.inputs.provider }}"
          if [ "$INPUT_PROVIDER" = "groq" ] || [ "$INPUT_PROVIDER" = "groq2" ]; then
            echo "LLM_PROVIDER=$INPUT_PROVIDER" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 13 ]; then
              echo "LLM_PROVIDER=groq" >> $GITHUB_ENV
            else
              echo "LLM_PROVIDER=groq2" >> $GITHUB_ENV
            fi
          fi

      - name: Run blog pipeline
        run: python main.py
        env:
          LLM_PROVIDER: ${{ env.LLM_PROVIDER }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_PUBLISHED: "true"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-reports-${{ github.run_id }}
          path: reports/
          retention-days: 30
